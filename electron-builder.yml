appId: com.blibla.captain
productName: Captain
copyright: Copyright © 2024 Blibla

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - resources/python/**/*
      - resources/actions/**/*
      - resources/7zip/**/*
      - resources/icon.png

publish:
  provider: github
  repo: captain
  owner: "blib-la"
  private: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"

asar: true
asarUnpack:
  - "resources/python/**/*"
  - "resources/actions/**/*"
  - "resources/7zip/**/*"
  - "resources/icon.png"

win:
  publisherName: Blibla
  verifyUpdateCodeSignature: false
